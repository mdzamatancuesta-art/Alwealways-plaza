<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listas de favoritos — Always Plaza</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2301A3F4'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Inter,sans-serif' font-weight='800' fill='%23fff' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tailwind.css" />
</head>

<body class="bg-main font-sans text-night antialiased" data-page="">
  <div id="site-header"></div>

  <main class="mx-auto max-w-[1400px] px-4 pb-16 md:px-8">
    <header class="pt-8">
      <h1 class="text-[28px] font-bold text-night">Listas de favoritos</h1>
      <p class="mt-2 text-[15px] text-mediumgrey">Encuentra todas tus listas en un solo lugar. Clasifica tus favoritos en diferentes listas y guárdalas aquí.</p>
    </header>

    <div id="favLists" class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

    <section class="mt-12">
      <h2 class="mb-5 text-xl font-bold text-night">Sugerencias para ti</h2>
      <div id="favSug" class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-5"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/logo.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    document.getElementById('favLists').innerHTML = FAV_LISTS.map((l) => `
      <a href="#" class="group flex items-center justify-between rounded-xl2 border border-lowgrey bg-white p-5 shadow-soft transition-all hover:-translate-y-1 hover:shadow-softlg">
        <div class="flex items-center gap-4">
          <span class="grid h-12 w-12 place-items-center rounded-xl bg-exito/10 text-exito">${AP.svg('<path d="M12 20s-7-4.6-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5C19 15.4 12 20 12 20Z"/>', 'h-6 w-6')}</span>
          <div><p class="text-[15px] font-semibold text-night">${l.name}</p><p class="text-[13px] text-mediumgrey">${l.count} productos</p></div>
        </div>
        <svg class="h-5 w-5 text-lowvis transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      </a>`).join('') + `
      <button class="flex items-center justify-center gap-2 rounded-xl2 border border-dashed border-nicegrey p-5 text-[14px] font-medium text-mediumgrey transition-colors hover:border-b2b hover:text-b2b">
        ${AP.svg('<path d="M12 5v14M5 12h14"/>', 'h-5 w-5')} Crear nueva lista
      </button>`;
    document.getElementById('favSug').innerHTML = genProducts(5).map(AP.productCard).join('');
  </script>
</body>
</html>
